version: 2
updates:
  - package-ecosystem: pip
    directory: /resume_generator_backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /resume-generator-frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /resume_generator_backend
      - /resume-generator-frontend
      - /latex-service
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
